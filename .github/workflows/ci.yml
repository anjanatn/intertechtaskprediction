name: InterTech Model CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run ML Training & Verification Pipeline
        run: |
          python train_and_predict.py

      - name: Verify Output Artifacts
        run: |
          test -f dashboard_data.json
          test -f public/dashboard_data.json
          python -c "import json; data=json.load(open('dashboard_data.json')); assert 'baseline_comparison' in data['meta']; print('CI Verification Successful: Baseline comparison present in dashboard payload.')"
